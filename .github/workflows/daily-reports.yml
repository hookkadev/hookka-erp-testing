name: Daily Reports — Brief / Schedule / Efficiency / Overdue

# Every 15 minutes, asks /api/internal/reports/due-trigger to send whatever is
# due. WHEN each report goes out (daily / weekly / monthly, at an SGT time) and
# WHO gets it are set per report on Settings > Email Reports in the ERP; the
# server remembers what it already sent today, so a late or dropped run just
# sends late, never twice. Unconfigured reports keep their old daily times:
# brief 07:00, schedule 08:00, efficiency 12:00, overdue 17:00 SGT. Nothing sends
# on Sundays or public holidays.
#
# Auth: each endpoint expects an x-cron-secret header. Shared secret lives in
# repo secrets as CRON_SECRET and on Cloudflare Pages env as CRON_SECRET. The
# Pages worker rejects with 503 if env var missing, 403 if header mismatches.
#
# Recipients: a report never saved on Settings > Email Reports falls back to
# DAILY_REPORT_RECIPIENTS, then SUPER_ADMINs.
#
# NOTE: GitHub runs scheduled workflows from the DEFAULT branch (main) only, so
# a schedule change here takes effect once it reaches main.
#
# Manual trigger: workflow_dispatch lets the operator backfill any single
# report on demand, ignoring its schedule.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 'Which report to fire (defaults to all four)'
        required: false
        type: choice
        default: 'all'
        options:
          - all
          - brief
          - schedule
          - efficiency
          - overdue
      date:
        description: 'Optional date override (YYYY-MM-DD). Leave blank for default.'
        required: false
        type: string

# Two overlapping runs could both see a report as due.
concurrency:
  group: daily-reports
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve which report(s) to send
        id: which
        env:
          GH_EVENT: ${{ github.event_name }}
          KIND_INPUT: ${{ inputs.kind }}
        run: |
          if [ "$GH_EVENT" = "workflow_dispatch" ]; then
            case "${KIND_INPUT:-all}" in
              brief)      echo "kinds=brief" >> "$GITHUB_OUTPUT" ;;
              schedule)   echo "kinds=schedule" >> "$GITHUB_OUTPUT" ;;
              efficiency) echo "kinds=efficiency" >> "$GITHUB_OUTPUT" ;;
              overdue)    echo "kinds=overdue" >> "$GITHUB_OUTPUT" ;;
              *)          echo "kinds=brief schedule efficiency overdue" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "kinds=due" >> "$GITHUB_OUTPUT"
          fi

      - name: POST trigger endpoint(s)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DATE_INPUT: ${{ inputs.date }}
          KINDS: ${{ steps.which.outputs.kinds }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is empty"
            exit 1
          fi
          BODY='{}'
          if [ -n "$DATE_INPUT" ]; then
            BODY="{\"date\":\"$DATE_INPUT\"}"
          fi
          fail=0
          for kind in $KINDS; do
            url="https://erp.hookka.com/api/internal/reports/${kind}-trigger"
            echo "--- Firing $kind → $url"
            response=$(curl --silent --show-error --write-out '\nHTTP_STATUS:%{http_code}' \
              --max-time 90 \
              --request POST \
              --header "Content-Type: application/json" \
              --header "x-cron-secret: $CRON_SECRET" \
              --data "$BODY" \
              "$url" || true)
            status=$(echo "$response" | tail -n1 | sed 's/HTTP_STATUS://')
            body=$(echo "$response" | sed '$d')
            echo "Status: $status"
            echo "Body: $body"
            if [ "$status" != "200" ]; then
              echo "::error::$kind trigger failed with HTTP $status"
              fail=1
            fi
          done
          exit $fail
