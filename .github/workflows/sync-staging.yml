name: Sync prod → staging

# Refreshes the staging Supabase project from prod. MANUAL ONLY (no cron): a
# nightly reset used to drop staging's whole `public` schema and wipe every test
# record, so the schedule was removed 2026-09-29.
#
# Two modes (workflow_dispatch input `mode`):
#   * merge (default) — NON-destructive. Copies prod rows staging does not have
#     yet (scripts/merge-prod-into-staging.mjs, INSERT ... ON CONFLICT DO
#     NOTHING). Never deletes or overwrites staging rows, so test data survives.
#     Does not change the schema; that arrives with the staging deploy.
#   * reset — DESTRUCTIVE. Drops staging's public schema and restores a pg_dump
#     of prod (public schema only; Supabase-managed schemas `auth`, `storage`,
#     `extensions` are untouched). Requires typing `SYNC` in `confirm`.
# Both modes finish with the mandatory sanitise + shared-PIN steps.
#
# Secrets required (already set):
#   * PROD_DATABASE_URL    — session pooler URL for prod Supabase
#   * STAGING_DATABASE_URL — session pooler URL for staging Supabase
#
# Both URLs MUST use the session pooler (port 5432 on
# aws-1-<region>.pooler.supabase.com) because GitHub Actions runners are
# IPv4-only and Supabase direct connections are IPv6 by default.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'merge (keeps staging test data) | reset (wipes staging, full prod clone)'
        required: true
        type: choice
        default: merge
        options:
          - merge
          - reset
      confirm:
        description: 'Only for reset: type SYNC to confirm (safety gate)'
        required: false
        type: string
concurrency:
  group: sync-staging
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate reset confirmation
        if: inputs.mode == 'reset'
        run: |
          if [[ "${{ inputs.confirm }}" != "SYNC" ]]; then
            echo "::error::mode=reset requires confirm input to be exactly 'SYNC'. Got: '${{ inputs.confirm }}'"
            exit 1
          fi
          echo "Reset confirmed."

      # Needed by the sanitisation step at the end of this job. Checked out and
      # installed up front so a dependency problem fails the run BEFORE prod is
      # dumped, rather than after staging has already been loaded with
      # unsanitised production data.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (for the sanitiser)
        run: npm ci --no-audit --no-fund

      - name: Install PostgreSQL 17 client
        if: inputs.mode == 'reset'
        # Supabase runs Postgres 17.6 on Pro plan as of 2026-05. pg_dump
        # requires client version >= server major. Ubuntu 24.04 only ships
        # 16 in the default repos so we pull from apt.postgresql.org.
        run: |
          sudo sh -c 'echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          # Ubuntu's postgresql-client-common wrapper picks the highest
          # *registered* major; on GHA runners postgresql-client-16 is
          # pre-installed and the wrapper picks 16. Force 17 via PATH.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/psql --version

      - name: pg_dump prod (public schema, custom format)
        if: inputs.mode == 'reset'
        env:
          PROD_URL: ${{ secrets.PROD_DATABASE_URL }}
          PGCONNECT_TIMEOUT: '30'
        run: |
          pg_dump \
            --no-owner --no-acl \
            --schema=public \
            --format=custom \
            --compress=9 \
            --file=prod.dump \
            "$PROD_URL"
          ls -lh prod.dump

      - name: Reset staging public schema (drop + recreate)
        if: inputs.mode == 'reset'
        env:
          STAGING_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PGCONNECT_TIMEOUT: '30'
        run: |
          psql "$STAGING_URL" -v ON_ERROR_STOP=1 <<'SQL'
            DROP SCHEMA IF EXISTS public CASCADE;
            CREATE SCHEMA public;
            GRANT ALL ON SCHEMA public TO postgres;
            GRANT ALL ON SCHEMA public TO anon, authenticated, service_role;
            GRANT ALL ON SCHEMA public TO public;
          SQL

      - name: Re-create prod's extensions on staging
        if: inputs.mode == 'reset'
        # DROP SCHEMA public CASCADE above also drops any extension that was
        # installed INTO the public schema (e.g. pg_trgm — a GIN index in the
        # dump needs its operator class public.gin_trgm_ops). pg_dump
        # --schema=public does NOT emit CREATE EXTENSION, so the restore would
        # fail ("operator class public.gin_trgm_ops does not exist"). Replay
        # prod's full extension list, each into the schema prod keeps it in,
        # BEFORE restoring. Idempotent (IF NOT EXISTS) and covers any extension
        # prod adds later, so the nightly sync won't break again.
        env:
          PROD_URL: ${{ secrets.PROD_DATABASE_URL }}
          STAGING_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PGCONNECT_TIMEOUT: '30'
        run: |
          psql "$PROD_URL" -tA -v ON_ERROR_STOP=1 -c \
            "SELECT 'CREATE EXTENSION IF NOT EXISTS ' || quote_ident(e.extname) || ' WITH SCHEMA ' || quote_ident(n.nspname) || ' CASCADE;' \
               FROM pg_extension e JOIN pg_namespace n ON n.oid = e.extnamespace \
              WHERE e.extname <> 'plpgsql' \
              ORDER BY 1;" > extensions.sql
          echo '--- extensions to recreate on staging ---'
          cat extensions.sql
          psql "$STAGING_URL" -v ON_ERROR_STOP=1 -f extensions.sql

      - name: Restore prod dump into staging
        if: inputs.mode == 'reset'
        env:
          STAGING_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PGCONNECT_TIMEOUT: '30'
        run: |
          # --exit-on-error stops on first failure so we don't end up with a
          # half-restored staging. --no-owner / --no-acl strips ownership
          # info (the prod and staging projects have different role names).
          pg_restore \
            --no-owner --no-acl \
            --schema=public \
            --exit-on-error \
            --dbname="$STAGING_URL" \
            prod.dump

      - name: ANALYZE staging (refresh planner stats after restore)
        if: inputs.mode == 'reset'
        env:
          STAGING_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PGCONNECT_TIMEOUT: '30'
        run: |
          # pg_restore loads rows + indexes but NOT planner statistics, so the
          # first data-heavy page loads crawl (seq scans on an un-analyzed DB).
          # ANALYZE rebuilds the stats so the planner picks good plans.
          # Stats-only — never touches data.
          psql "$STAGING_URL" -v ON_ERROR_STOP=1 -c "ANALYZE;"
          echo "ANALYZE complete."

      - name: Verify staging matches prod
        if: inputs.mode == 'reset'
        env:
          PROD_URL: ${{ secrets.PROD_DATABASE_URL }}
          STAGING_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PGCONNECT_TIMEOUT: '30'
        run: |
          echo "=== Prod row counts ==="
          psql "$PROD_URL" -c "SELECT (SELECT COUNT(*) FROM job_cards) AS jc, (SELECT COUNT(*) FROM audit_events) AS audit, (SELECT MAX(applied_at) FROM _migrations) AS latest_migration;"
          echo "=== Staging row counts ==="
          psql "$STAGING_URL" -c "SELECT (SELECT COUNT(*) FROM job_cards) AS jc, (SELECT COUNT(*) FROM audit_events) AS audit, (SELECT MAX(applied_at) FROM _migrations) AS latest_migration;"

      - name: Merge prod rows into staging (insert-only, keeps staging data)
        if: inputs.mode == 'merge'
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_STAGING_REF: ${{ secrets.SUPABASE_STAGING_REF }}
        run: node scripts/merge-prod-into-staging.mjs --apply
      # MANDATORY. The steps above have just loaded verbatim production rows
      # into a public-internet test site: real payroll, real bank accounts and
      # passport numbers, ~4,200 live auth tokens, every customer and supplier
      # contact detail, ~3,200 real business emails, and a queue of outbound
      # mail addressed to real customers.
      #
      # This step is what makes staging safe to hand to a tester or an intern.
      # It is deliberately placed so that it CANNOT be skipped: if it fails, the
      # job fails, and the job failing is the signal that staging is not safe to
      # use. Do not add `continue-on-error` here. If this step is ever removed,
      # the sync must be disabled with it.
      #
      # The script asserts it is talking to the staging project before writing a
      # single row, and re-queries afterwards to prove the scrub landed.
      - name: Sanitise staging (MANDATORY — strips payroll / PII / credentials)
        if: ${{ !cancelled() && (inputs.mode == 'merge' || success()) }}
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_STAGING_REF: ${{ secrets.SUPABASE_STAGING_REF }}
        run: node scripts/sanitize-staging.mjs --apply

      # Staging is a TEST environment — after cloning prod, set every worker's
      # phone-portal PIN to the shared test value 123456 so the owner / test
      # team can log into /worker/login with any empNo + 123456 (owner request
      # 2026-06-14). Staging-only (uses STAGING_DATABASE_URL). worker_pins stores
      # an UNSALTED SHA-256 hex of the PIN (see src/api/lib/auth-utils.ts
      # hashPin); we compute it in-shell so there's no pgcrypto dependency.
      # must_reset=false so the 6-digit force-reset gate (migration 0079) doesn't
      # block login. Raw psql bypasses the camelCase→snake_case adapter, so the
      # real snake_case columns are used (worker_id / pin / updated_at).
      - name: Set all staging worker PINs to the shared test value (123456)
        if: ${{ !cancelled() && (inputs.mode == 'merge' || success()) }}
        env:
          STAGING_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PGCONNECT_TIMEOUT: '30'
        run: |
          HASH=$(printf '123456' | sha256sum | cut -d' ' -f1)
          echo "SHA-256(123456) = $HASH"
          psql "$STAGING_URL" -v ON_ERROR_STOP=1 -v pinhash="$HASH" <<'SQL'
            INSERT INTO worker_pins (worker_id, pin, updated_at, must_reset)
            SELECT id, :'pinhash', now()::text, false FROM workers
            ON CONFLICT (worker_id) DO UPDATE
              SET pin = EXCLUDED.pin, updated_at = EXCLUDED.updated_at, must_reset = false;
          SQL
          echo "=== worker_pins rows now (= every worker, PIN 123456): ==="
          psql "$STAGING_URL" -c "SELECT COUNT(*) AS pins FROM worker_pins;"
          echo "=== sample ACTIVE empNos to log in with (PIN 123456): ==="
          psql "$STAGING_URL" -c "SELECT emp_no, name, department_code FROM workers WHERE status = 'ACTIVE' ORDER BY emp_no LIMIT 10;"
